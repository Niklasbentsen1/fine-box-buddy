workflows:
  ios-capacitor:
    name: iOS Capacitor Build

    instance_type: mac_mini_m1

    max_build_duration: 60

    environment:
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: app.boedekassen

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.boedekassen

    cache:
      cache_paths:
        - node_modules
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Set up signing
        script: |
          keychain initialize

          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles


      - name: Build IPA
  script: |
    xcode-project build-ipa \
      --project "ios/App/App.xcodeproj" \
      --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
