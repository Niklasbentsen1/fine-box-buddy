workflows:
  ios-capacitor:
    name: iOS Capacitor Build

    integrations:
      app_store_connect: Codemagic

    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: app.boedekassen

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.boedekassen

    cache:
      cache_paths:
        - node_modules
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web
        script: |
          npm run build:mobile

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Verify aps-environment in provisioning profile
        script: |
          set +e
          FOUND=0
          for PROFILE in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            [ -f "$PROFILE" ] || continue
            PLIST=$(security cms -D -i "$PROFILE" 2>/dev/null || true)
            echo "$PLIST" | grep -q "app.boedekassen" || continue
            if echo "$PLIST" | grep -q "aps-environment"; then
              echo "OK: profilen indeholder aps-environment"
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "ADVARSEL: fandt ingen profil med aps-environment (fortsætter)"
          fi



      - name: Use profiles
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set +e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"
          BUILD_STATUS=$?

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "========== DETALJERET XCODE-FEJL =========="
            for LOG_FILE in /tmp/xcodebuild_logs/*.log; do
              if [ -f "$LOG_FILE" ]; then
                echo "--- $LOG_FILE ---"
                cat "$LOG_FILE"
              fi
            done
            echo "========== SLUT PÅ XCODE-FEJL ============="
          fi

          exit "$BUILD_STATUS"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
