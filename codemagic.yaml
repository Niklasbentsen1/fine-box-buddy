workflows:
  ios-capacitor:
    name: iOS Capacitor Build

    integrations:
      app_store_connect: Codemagic

    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: app.boedekassen

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.boedekassen

    cache:
      cache_paths:
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Clean caches
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Caches/com.apple.dt.Xcode

      - name: Set build number from App Store Connect
        script: |
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=$(cd ios/App && agvtool what-version -terse)
          fi
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Bruger build number: $NEW_BUILD_NUMBER"
          cd ios/App && agvtool new-version -all "$NEW_BUILD_NUMBER"

      - name: Install dependencies
        script: |
          npm ci

      - name: Build web
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Set up signing
        script: |
          keychain initialize

          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles

      - name: Build IPA
        script: |
          set +e
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
          BUILD_STATUS=$?

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "========== DETALJERET XCODE-FEJL =========="
            for LOG_FILE in /tmp/xcodebuild_logs/*.log; do
              if [ -f "$LOG_FILE" ]; then
                echo "--- $LOG_FILE ---"
                cat "$LOG_FILE"
              fi
            done
            echo "========== SLUT PÅ XCODE-FEJL ============="
          fi

          exit "$BUILD_STATUS"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
